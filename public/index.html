<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>pi · web</title>
<style>
  :root {
    --bg: #0e1116; --panel: #161b22; --panel-2: #1c2230; --border: #2a3240;
    --fg: #e6edf3; --muted: #8b98a9; --accent: #4c9aff; --accent-2: #2f7ae5;
    --user: #1f3a5f; --tool: #1d2a1f; --err: #5a2327; --ok: #3fb950;
    --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg); color: var(--fg);
    font: 14px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    display: flex; flex-direction: column;
  }
  header {
    display: flex; align-items: center; gap: 12px;
    padding: 10px 16px; background: var(--panel); border-bottom: 1px solid var(--border);
    position: sticky; top: 0; z-index: 10;
  }
  header .title { font-weight: 700; letter-spacing: .2px; }
  header .model { color: var(--muted); font-family: var(--mono); font-size: 12px; }
  header .spacer { flex: 1; }
  .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--muted); }
  .dot.on { background: var(--ok); box-shadow: 0 0 8px var(--ok); }
  .dot.busy { background: #e3b341; box-shadow: 0 0 8px #e3b341; animation: pulse 1s infinite alternate; }
  @keyframes pulse { to { opacity: .35; } }
  #status { color: var(--muted); font-size: 12px; }

  main { flex: 1; overflow-y: auto; padding: 20px 16px 8px; scroll-behavior: smooth; }
  .wrap { max-width: 920px; margin: 0 auto; display: flex; flex-direction: column; gap: 12px; }

  .msg { border: 1px solid var(--border); border-radius: 10px; background: var(--panel); overflow: hidden; }
  .msg.user { background: var(--user); border-color: #2c4f7c; }
  .msg .role { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); padding: 6px 12px; border-bottom: 1px solid var(--border); }
  .msg .body { padding: 10px 12px; white-space: normal; overflow-wrap: anywhere; }
  .msg.user .body { white-space: pre-wrap; }

  /* ---- markdown ---- */
  .md { line-height: 1.65; }
  .md > :first-child { margin-top: 0; }
  .md > :last-child { margin-bottom: 0; }
  .md h1, .md h2, .md h3, .md h4, .md h5, .md h6 { margin: 1.1em 0 .5em; line-height: 1.3; font-weight: 700; }
  .md h1 { font-size: 1.5em; border-bottom: 1px solid var(--border); padding-bottom: .25em; }
  .md h2 { font-size: 1.28em; border-bottom: 1px solid var(--border); padding-bottom: .2em; }
  .md h3 { font-size: 1.12em; }
  .md h4, .md h5, .md h6 { font-size: 1em; color: #c9d5e4; }
  .md p { margin: .55em 0; }
  .md ul, .md ol { margin: .55em 0; padding-left: 1.55em; }
  .md li { margin: .22em 0; }
  .md li > ul, .md li > ol { margin: .22em 0; }
  .md li::marker { color: var(--muted); }
  .md blockquote { margin: .6em 0; padding: .15em .9em; border-left: 3px solid var(--accent); color: #b8c4d4; background: #12161d; border-radius: 0 6px 6px 0; }
  .md blockquote > :first-child { margin-top: .3em; }
  .md blockquote > :last-child { margin-bottom: .3em; }
  .md hr { border: none; border-top: 1px solid var(--border); margin: 1em 0; }
  .md a { color: var(--accent); text-decoration: none; }
  .md a:hover { text-decoration: underline; }
  .md img { max-width: 100%; border-radius: 6px; }
  .md del { color: var(--muted); }
  .md table { border-collapse: collapse; margin: .7em 0; display: block; overflow-x: auto; max-width: 100%; }
  .md th, .md td { border: 1px solid var(--border); padding: 5px 10px; text-align: left; }
  .md th { background: var(--panel-2); }
  .md input[type=checkbox] { margin-right: .4em; vertical-align: middle; }
  .md code { background: #0b0f14; border: 1px solid var(--border); border-radius: 5px; padding: 1px 5px; font-family: var(--mono); font-size: 12.5px; }
  .md pre { background: #0b0f14; border: 1px solid var(--border); border-radius: 8px; padding: 10px 12px; overflow-x: auto; margin: .6em 0; }
  .md pre code { background: none; border: none; padding: 0; font-size: 12.5px; font-family: var(--mono); }

  /* ---- highlight.js (github-dark-ish) ---- */
  .hljs { color: #e6edf3; background: transparent; }
  .hljs-comment, .hljs-quote { color: #8b949e; font-style: italic; }
  .hljs-keyword, .hljs-selector-tag, .hljs-literal, .hljs-type, .hljs-tag { color: #ff7b72; }
  .hljs-string, .hljs-doctag, .hljs-regexp, .hljs-char.escape_ { color: #a5d6ff; }
  .hljs-number, .hljs-symbol, .hljs-bullet, .hljs-link { color: #79c0ff; }
  .hljs-title, .hljs-section, .hljs-name, .hljs-title.function_, .hljs-selector-id, .hljs-selector-class { color: #d2a8ff; }
  .hljs-attr, .hljs-attribute, .hljs-variable, .hljs-template-variable, .hljs-selector-attr, .hljs-selector-pseudo { color: #ffa657; }
  .hljs-built_in, .hljs-builtin-name, .hljs-params { color: #ffa657; }
  .hljs-meta, .hljs-meta .hljs-keyword { color: #8b949e; }
  .hljs-strong { font-weight: 700; }
  .hljs-emphasis { font-style: italic; }
  .hljs-addition { color: #aff5b4; background: #033a16; }
  .hljs-deletion { color: #ffdcd7; background: #67060c; }
  /* merged per-turn trace: all thinking + tool calls in one collapsed block */
  details.trace { margin: 6px 0; border: 1px solid var(--border); border-radius: 8px; background: #12161d; }
  details.trace.empty { display: none; }
  details.trace > summary { cursor: pointer; padding: 6px 10px; font-size: 12px; color: var(--muted); display: flex; gap: 8px; align-items: center; list-style: none; }
  details.trace > summary::-webkit-details-marker { display: none; }
  details.trace > summary::before { content: '▸'; color: var(--muted); transition: transform .15s; }
  details.trace[open] > summary::before { transform: rotate(90deg); }
  details.trace > summary .trace-meta { margin-left: auto; font-family: var(--mono); font-size: 11px; color: var(--muted); }
  .trace-body { padding: 6px 8px 8px; display: flex; flex-direction: column; gap: 6px; border-top: 1px dashed var(--border); }

  .think { border-left: 2px solid #3a4657; padding: 2px 0 2px 9px; }
  .think .think-label { font-size: 11px; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); margin-bottom: 3px; }
  .think .inner { white-space: pre-wrap; color: #b8c4d4; font-size: 12.5px; }

  .tool { margin: 8px 0; border: 1px solid var(--border); border-radius: 8px; background: var(--tool); padding: 6px 10px; }
  .trace-body .tool { margin: 0; }
  .tool summary { cursor: pointer; display: flex; gap: 8px; align-items: baseline; font-family: var(--mono); font-size: 12.5px; color: #9fe0a8; }
  .tool summary .tname { flex: none; }
  .tool summary .preview { flex: 1; color: var(--muted); font-size: 11px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tool .args { font-family: var(--mono); font-size: 12px; color: var(--muted); white-space: pre-wrap; overflow-wrap: anywhere; padding: 4px 0; }
  .tool pre { background: #0b0f14; border: 1px solid var(--border); border-radius: 6px; padding: 8px; overflow-x: auto; font-size: 12px; max-height: 360px; overflow-y: auto; margin: 6px 0 2px; }
  .tool.error { background: var(--err); }

  .sys { text-align: center; color: var(--muted); font-size: 12px; font-family: var(--mono); padding: 2px; }

  /* ---- history navigation: prev/next pill + input jump list ---- */
  .nav {
    position: fixed; right: 16px; bottom: 96px; z-index: 30;
    display: flex; flex-direction: column; align-items: flex-end; gap: 8px;
  }
  .nav-bar {
    display: flex; align-items: center; gap: 2px;
    background: var(--panel); border: 1px solid var(--border);
    border-radius: 999px; padding: 4px; box-shadow: 0 6px 18px rgba(0,0,0,.35);
  }
  .nav-btn {
    width: 32px; height: 32px; display: flex; align-items: center; justify-content: center;
    background: transparent; border: none; color: var(--fg); border-radius: 999px;
    font-size: 11px; line-height: 1; cursor: pointer;
  }
  .nav-btn:hover:not(:disabled) { background: var(--panel-2); color: var(--accent); }
  .nav-btn:active:not(:disabled) { transform: scale(.92); }
  .nav-btn:disabled { opacity: .3; cursor: default; }
  .nav-btn.on { background: var(--panel-2); color: var(--accent); }
  .nav-pos {
    min-width: 48px; text-align: center; user-select: none;
    font-family: var(--mono); font-size: 11.5px; color: var(--muted);
  }
  .nav-pos.at { color: var(--fg); }
  .nav-sep { width: 1px; height: 20px; background: var(--border); margin: 0 3px; }

  .nav-panel {
    width: min(380px, 88vw); background: var(--panel); border: 1px solid var(--border);
    border-radius: 12px; box-shadow: 0 10px 30px rgba(0,0,0,.45);
    display: flex; flex-direction: column; overflow: hidden;
  }
  .nav-panel.hidden { display: none; }
  .nav-head { display: flex; align-items: center; gap: 7px; padding: 8px 10px; border-bottom: 1px solid var(--border); font-size: 12px; }
  .nav-head .t { flex: 1; font-weight: 600; color: var(--fg); letter-spacing: .02em; }
  .nav-total { background: var(--panel-2); border: 1px solid var(--border); border-radius: 999px; padding: 0 7px; font-family: var(--mono); font-size: 11px; color: var(--muted); }
  .nav-mini { background: var(--panel-2); border: 1px solid var(--border); color: var(--fg); border-radius: 7px; padding: 3px 8px; font: inherit; font-size: 11.5px; cursor: pointer; }
  .nav-mini:hover { border-color: var(--accent); }
  .nav-list { flex: 1; min-height: 0; overflow-y: auto; padding: 6px; display: flex; flex-direction: column; gap: 4px; }
  .nav-empty { color: var(--muted); font-size: 12px; text-align: center; padding: 14px 4px; }
  .nav-item {
    display: flex; gap: 8px; align-items: flex-start; width: 100%;
    background: transparent; border: 1px solid transparent; border-radius: 8px;
    padding: 6px 8px; text-align: left; color: var(--fg); font: inherit; font-size: 12.5px; cursor: pointer;
  }
  .nav-item:hover { background: var(--panel-2); border-color: var(--border); }
  .nav-item.active { background: #1f3a5f; border-color: #2c4f7c; }
  .nav-idx { flex: none; color: var(--muted); font-family: var(--mono); font-size: 11px; padding-top: 1px; min-width: 20px; }
  .nav-text { flex: 1; color: #c9d5e4; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }

  .flash { animation: flash 1.4s ease-out; }
  @keyframes flash { 0% { box-shadow: 0 0 0 3px rgba(76,154,255,.9); } 100% { box-shadow: 0 0 0 3px rgba(76,154,255,0); } }

  footer { border-top: 1px solid var(--border); background: var(--panel); padding: 10px 16px 14px; }
  .composer { max-width: 920px; margin: 0 auto; display: flex; gap: 8px; align-items: flex-end; }
  textarea {
    flex: 1; resize: none; min-height: 46px; max-height: 200px;
    background: var(--panel-2); color: var(--fg); border: 1px solid var(--border);
    border-radius: 10px; padding: 11px 12px; font: inherit; outline: none;
  }
  textarea:focus { border-color: var(--accent); }
  button {
    border: none; border-radius: 10px; padding: 11px 16px; font: inherit; font-weight: 600;
    background: var(--accent); color: #fff; cursor: pointer;
  }
  button:hover { background: var(--accent-2); }
  button.ghost { background: var(--panel-2); color: var(--fg); border: 1px solid var(--border); }
  button:disabled { opacity: .45; cursor: default; }
  .hint { max-width: 920px; margin: 6px auto 0; color: var(--muted); font-size: 11.5px; }

  /* ---- layout: left session sidebar + chat column ---- */
  #layout { flex: 1; display: flex; min-height: 0; min-width: 0; }
  #sidebar {
    width: 272px; flex: none; display: flex; flex-direction: column; min-height: 0;
    background: var(--panel); border-right: 1px solid var(--border);
    transition: width .15s ease;
  }
  #sidebar.collapsed { width: 0; border-right: none; overflow: hidden; }
  .sb-head { display: flex; align-items: center; gap: 6px; padding: 9px 10px; border-bottom: 1px solid var(--border); flex: none; }
  .sb-title { flex: 1; font-size: 11.5px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
  .sb-btn { background: var(--panel-2); border: 1px solid var(--border); color: var(--fg); border-radius: 7px; width: 26px; height: 26px; cursor: pointer; font-size: 13px; line-height: 1; padding: 0; }
  .sb-btn:hover { border-color: var(--accent); color: var(--accent); }
  .sb-list { flex: 1; min-height: 0; overflow-y: auto; padding: 6px; display: flex; flex-direction: column; gap: 4px; }
  .sb-empty { color: var(--muted); font-size: 12px; text-align: center; padding: 16px 4px; }
  .sb-item { display: block; width: 100%; text-align: left; background: transparent; border: 1px solid transparent; border-radius: 8px; padding: 7px 9px; cursor: pointer; color: var(--fg); font: inherit; }
  .sb-item:hover { background: var(--panel-2); border-color: var(--border); }
  .sb-item.active, .sb-row.active .sb-item { background: #1f3a5f; border-color: #2c4f7c; }
  .sb-row.active .sb-del { opacity: 1; }
  .sb-row { position: relative; }
  .sb-del {
    position: absolute; top: 5px; right: 5px; width: 22px; height: 22px; padding: 0;
    display: flex; align-items: center; justify-content: center;
    background: var(--panel-2); border: 1px solid var(--border); color: var(--muted);
    border-radius: 6px; font-size: 13px; line-height: 1; cursor: pointer;
    opacity: 0; transition: opacity .12s;
  }
  .sb-row:hover .sb-del { opacity: 1; }
  .sb-del:hover { color: #ff7b72; border-color: #7a2a2f; background: #2a1416; }
  .sb-forks { color: var(--accent); }
  .sb-item-title { font-size: 12.5px; color: #dbe4ef; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .sb-item-meta { display: flex; gap: 8px; margin-top: 3px; font-family: var(--mono); font-size: 10.5px; color: var(--muted); }
  .sb-item-meta > span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .sb-item-meta .proj { flex: 1; }
  #chatcol { flex: 1; display: flex; flex-direction: column; min-width: 0; min-height: 0; }
  .icon-btn { width: 30px; height: 30px; display: inline-flex; align-items: center; justify-content: center; background: transparent; border: 1px solid transparent; color: var(--fg); border-radius: 8px; cursor: pointer; font-size: 14px; padding: 0; }
  .icon-btn:hover { background: var(--panel-2); border-color: var(--border); }

  #backdrop { position: fixed; inset: 0; background: rgba(0,0,0,.55); display: none; align-items: center; justify-content: center; z-index: 50; }
  #backdrop.show { display: flex; }
  .modal { background: var(--panel); border: 1px solid var(--border); border-radius: 12px; padding: 18px; width: min(520px, 92vw); }
  .modal h3 { margin: 0 0 10px; font-size: 15px; }
  .modal .opts { display: flex; flex-direction: column; gap: 6px; margin: 12px 0; }
  .modal .opts button { background: var(--panel-2); border: 1px solid var(--border); color: var(--fg); text-align: left; }
  .modal .opts button:hover { border-color: var(--accent); }
  .modal textarea { width: 100%; }
  .modal .row { display: flex; gap: 8px; justify-content: flex-end; margin-top: 12px; }
</style>
</head>
<body>
<header>
  <button class="icon-btn" id="sbToggle" title="显示/隐藏历史会话">☰</button>
  <span class="dot" id="dot"></span>
  <span class="title">pi</span>
  <span class="model" id="model">connecting…</span>
  <span class="spacer"></span>
  <span id="status">connecting</span>
</header>

<div id="layout">
  <aside id="sidebar">
    <div class="sb-head">
      <span class="sb-title">历史会话</span>
      <button class="sb-btn" id="sbNew" title="开启新会话">＋</button>
      <button class="sb-btn" id="sbRefresh" title="刷新">⟳</button>
    </div>
    <div class="sb-list" id="sbList"><div class="sb-empty">加载中…</div></div>
  </aside>

  <div id="chatcol">
    <main id="main"><div class="wrap" id="wrap"></div></main>

    <footer>
      <div class="composer">
        <textarea id="input" placeholder="Ask pi…  (Enter to send, Shift+Enter for newline)"></textarea>
        <button class="ghost" id="stop" title="Abort current run">Stop</button>
        <button id="send">Send</button>
      </div>
      <div class="hint" id="hint">SSE connected · messages are streamed live from the pi RPC session</div>
    </footer>
  </div>
</div>

<div class="nav" id="nav">
  <div class="nav-panel hidden" id="navPanel">
    <div class="nav-head">
      <span class="t">历史输入</span>
      <span class="nav-total" id="navTotal">0</span>
      <button class="nav-mini" id="navPanelClose" title="收起">×</button>
    </div>
    <div class="nav-list" id="navList"></div>
  </div>
  <div class="nav-bar">
    <button class="nav-btn" id="navPrev" title="上一条回复 (Alt+↑)" aria-label="上一条回复">▲</button>
    <span class="nav-pos" id="navPos">0/0</span>
    <button class="nav-btn" id="navNext" title="下一条回复 (Alt+↓)" aria-label="下一条回复">▼</button>
    <span class="nav-sep"></span>
    <button class="nav-btn" id="navListBtn" title="历史输入列表" aria-label="历史输入列表">☰</button>
  </div>
</div>

<div id="backdrop"><div class="modal" id="modal"></div></div>

<script src="/vendor/marked.min.js"></script>
<script src="/vendor/highlight.min.js"></script>
<script>
(function () {
  const wrap = document.getElementById('wrap');
  const main = document.getElementById('main');
  const input = document.getElementById('input');
  const sendBtn = document.getElementById('send');
  const stopBtn = document.getElementById('stop');
  const dot = document.getElementById('dot');
  const modelEl = document.getElementById('model');
  const statusEl = document.getElementById('status');
  const hintEl = document.getElementById('hint');
  const backdrop = document.getElementById('backdrop');
  const modal = document.getElementById('modal');
  const nav = document.getElementById('nav');
  const navPrev = document.getElementById('navPrev');
  const navNext = document.getElementById('navNext');
  const navPos = document.getElementById('navPos');
  const navListBtn = document.getElementById('navListBtn');
  const navPanel = document.getElementById('navPanel');
  const navList = document.getElementById('navList');
  const navTotal = document.getElementById('navTotal');
  const navPanelClose = document.getElementById('navPanelClose');
  const footerEl = document.querySelector('footer');
  const sidebar = document.getElementById('sidebar');
  const sbToggle = document.getElementById('sbToggle');
  const sbList = document.getElementById('sbList');
  const sbRefresh = document.getElementById('sbRefresh');
  const sbNew = document.getElementById('sbNew');

  let allAssistant = [];     // every merged reply box, in document order
  let assistantNodes = [];   // navigable subset: only replies with visible body text
  let activeNode = null;     // reply scroll-spy cursor (element)
  let userNodes = [];        // every user input box, in document order
  let activeInput = null;    // input scroll-spy cursor (element)
  let msgSeq = 0;            // increments per assistant message inside a merged reply
  let currentSessionPath = null;   // active session file (from pi get_state)
  let sessionList = [];            // last /sessions result
  let focusAfterSnapshot = false;  // focus input + reveal newest reply after a switch
  let stickToBottom = true;        // follow streaming output while pinned to the bottom

  let streaming = false;
  let currentAssistant = null;        // wrapper element for the in-flight assistant msg
  const textBlocks = new Map();       // contentIndex -> {el, raw}
  const thinkBlocks = new Map();
  const toolEls = new Map();          // toolCallId -> element

  const esc = (s) => s.replace(/[&<>"']/g, (c) => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));

  // ---- Markdown: use pi's bundled marked + highlight.js, mirroring the
  // ---- exact renderer config used by `pi --export` (HTML disabled, URL allow-list).
  function initMarkdown() {
    if (typeof marked === 'undefined') return false;
    const hl = (typeof hljs !== 'undefined') ? hljs : null;
    const sanitizeUrl = (value) => {
      const href = String(value || '').trim().replace(/[\x00-\x1f\x7f]/g, '');
      if (!href) return href;
      const scheme = href.match(/^([A-Za-z][A-Za-z0-9+.-]*):/);
      if (scheme && !/^(https?|mailto|tel|ftp)$/i.test(scheme[1])) return null;
      return href;
    };
    try {
      marked.use({
        breaks: true,
        gfm: true,
        tokenizer: {
          // Render raw HTML as literal text so the model can't inject markup.
          html() { return undefined; },
          tag() { return undefined; },
        },
        renderer: {
          link(token) {
            const href = sanitizeUrl(token.href);
            if (href === null) return this.parser.parseInline(token.tokens);
            let out = '<a href="' + esc(href) + '" target="_blank" rel="noopener noreferrer"';
            if (token.title) out += ' title="' + esc(token.title) + '"';
            return out + '>' + this.parser.parseInline(token.tokens) + '</a>';
          },
          image(token) {
            const href = sanitizeUrl(token.href);
            if (href === null) return esc(token.text || '');
            let out = '<img src="' + esc(href) + '" alt="' + esc(token.text || '') + '"';
            if (token.title) out += ' title="' + esc(token.title) + '"';
            return out + '>';
          },
          code(token) {
            const text = token.text, lang = token.lang;
            if (!hl) return '<pre><code>' + esc(text) + '</code></pre>';
            let out;
            if (lang && hl.getLanguage(lang)) {
              try { out = hl.highlight(text, { language: lang }).value; } catch { out = esc(text); }
            } else {
              try { out = hl.highlightAuto(text).value; } catch { out = esc(text); }
            }
            return '<pre><code class="hljs">' + out + '</code></pre>';
          },
          codespan(token) { return '<code>' + esc(token.text) + '</code>'; },
        },
      });
      return true;
    } catch (err) {
      console.warn('marked init failed, using fallback renderer', err);
      return false;
    }
  }
  const MD_ENABLED = initMarkdown();
  console.log('[pi-webui] markdown:', MD_ENABLED ? 'marked' + (typeof hljs !== 'undefined' ? ' + highlight.js' : '') : 'built-in fallback');

  function fallbackMd(src) {
    const parts = String(src).split('```');
    let out = '';
    parts.forEach((part, i) => {
      if (i % 2 === 1) {
        const nl = part.indexOf('\n');
        const code = nl === -1 ? part : part.slice(nl + 1);
        out += '<pre><code>' + esc(code) + '</code></pre>';
      } else {
        out += esc(part)
          .replace(/`([^`\n]+)`/g, '<code>$1</code>')
          .replace(/\*\*([^*\n]+)\*\*/g, '<strong>$1</strong>')
          .replace(/\n/g, '<br>');
      }
    });
    return out;
  }

  function renderMarkdown(src) {
    if (MD_ENABLED) {
      try { return marked.parse(String(src ?? '')); } catch (err) { console.warn('marked parse failed', err); }
    }
    return fallbackMd(src ?? '');
  }

  function atBottom(tolerance) {
    return main.scrollHeight - main.scrollTop - main.clientHeight <= (tolerance || 80);
  }

  // Keep the newest output in view while the user is following along at the bottom.
  function scroll() {
    if (stickToBottom) main.scrollTop = main.scrollHeight;
  }

  function el(tag, cls, html) {
    const e = document.createElement(tag);
    if (cls) e.className = cls;
    if (html != null) e.innerHTML = html;
    return e;
  }

  /** Create a new merged reply box (thinking + tool calls + body all live inside it). */
  function newReplyBox() {
    const box = el('div', 'msg assistant');
    box.appendChild(el('div', 'role', 'assistant'));
    // Single collapsed sub-block holding every thinking step and tool call of the turn.
    const trace = el('details', 'trace empty');
    const sum = el('summary');
    sum.appendChild(el('span', 'trace-label', '思考与工具调用'));
    sum.appendChild(el('span', 'trace-meta', ''));
    trace.appendChild(sum);
    trace.appendChild(el('div', 'trace-body'));
    box.appendChild(trace);
    box.appendChild(el('div', 'body'));
    wrap.appendChild(box);
    textBlocks.clear(); thinkBlocks.clear();
    msgSeq = 0;
    registerAssistant(box);
    scroll();
    return box;
  }

  /** Reuse the in-flight reply box so consecutive assistant messages merge into one reply. */
  function ensureReply() {
    if (!currentAssistant) currentAssistant = newReplyBox();
    return currentAssistant;
  }

  function addUser(text) {
    currentAssistant = null;   // a user input always starts a new reply
    const box = el('div', 'msg user');
    box.appendChild(el('div', 'role', 'you'));
    box.appendChild(el('div', 'body', esc(text)));
    wrap.appendChild(box);
    userNodes.push(box);
    if (!navPanel.classList.contains('hidden')) { renderInputList(); updateInputHighlight(); }
    scroll();
  }

  function addSystem(text) {
    wrap.appendChild(el('div', 'sys', esc(text)));
    scroll();
  }

  function bodyOf(box) { return box.querySelector('.body'); }

  /* ---------------- merged thinking / tool-call trace ---------------- */

  function traceOf(box) { return box.querySelector(':scope > .trace'); }
  function traceBodyOf(box) { return traceOf(box).querySelector('.trace-body'); }

  /** Refresh the collapsed trace header ("N 次思考 · M 次调用") and hide it when empty. */
  function updateTrace(box) {
    const trace = traceOf(box);
    if (!trace) return;
    const thinks = trace.querySelectorAll('.think').length;
    const tools = trace.querySelectorAll('.tool').length;
    const parts = [];
    if (thinks) parts.push(thinks + ' 次思考');
    if (tools) parts.push(tools + ' 次调用');
    trace.classList.toggle('empty', parts.length === 0);
    trace.querySelector('.trace-meta').textContent = parts.join(' · ');
  }

  function previewArgs(args) {
    try {
      const s = typeof args === 'string' ? args : JSON.stringify(args ?? {});
      return s.replace(/\s+/g, ' ').slice(0, 80);
    } catch { return ''; }
  }

  /** Build a tool card (collapsed by default) inside the turn's trace block. */
  function makeToolCard(name, args) {
    const d = el('details', 'tool');
    const sum = el('summary');
    sum.appendChild(el('span', 'tname', esc(name || 'tool')));
    sum.appendChild(el('span', 'preview', esc(previewArgs(args))));
    d.appendChild(sum);
    d.appendChild(el('div', 'args'));
    d.appendChild(el('div', 'res'));
    if (args !== undefined && args !== null && args !== '') {
      d.querySelector('.args').textContent = typeof args === 'string' ? args : JSON.stringify(args, null, 2);
    }
    return d;
  }

  /** Build a thinking block for the trace. */
  function makeThinkBlock(text) {
    const d = el('div', 'think');
    d.appendChild(el('div', 'think-label', '思考'));
    d.appendChild(el('div', 'inner', esc(text || '')));
    return d;
  }

  /* ---------------- history navigation ---------------- */

  /** Does this assistant message actually emit body text (not just thinking / tool calls)? */
  function hasBody(box) {
    const mdEl = box.querySelector('.md');
    return !!(mdEl && mdEl.textContent.trim());
  }

  /** Recompute the navigable set so only body-text replies are counted. */
  function syncNav() {
    const prevActive = activeNode;
    assistantNodes = allAssistant.filter(hasBody);
    if (prevActive && !assistantNodes.includes(prevActive)) activeNode = null;
    refreshNav();
  }

  function registerAssistant(box) {
    allAssistant.push(box);
    syncNav();
  }

  function refreshNav() {
    const total = assistantNodes.length;
    if (!total) {
      navPos.textContent = '0/0';
      navPos.classList.remove('at');
      navPrev.disabled = true;
      navNext.disabled = true;
      return;
    }
    const idx = activeNode ? assistantNodes.indexOf(activeNode) : -1;
    navPos.textContent = (idx >= 0 ? idx + 1 : '–') + '/' + total;
    navPos.classList.toggle('at', idx >= 0);
    navPrev.disabled = idx <= 0;
    navNext.disabled = idx >= total - 1;
  }

  function gotoAssistant(i) {
    const total = assistantNodes.length;
    if (!total) return;
    i = Math.max(0, Math.min(total - 1, i));
    const node = assistantNodes[i];
    node.scrollIntoView({ behavior: 'smooth', block: 'start' });
    node.classList.remove('flash');
    void node.offsetWidth;
    node.classList.add('flash');
    setTimeout(() => node.classList.remove('flash'), 1500);
    activeNode = node;
    refreshNav();
  }

  function stepAssistant(delta) {
    const total = assistantNodes.length;
    if (!total) return;
    const idx = activeNode ? assistantNodes.indexOf(activeNode) : -1;
    if (idx < 0) gotoAssistant(delta > 0 ? 0 : total - 1);
    else gotoAssistant(idx + delta);
  }

  /* ---- input jump list ---- */

  function previewOf(node) {
    const b = node.querySelector('.body');
    let t = (b ? b.textContent : node.textContent) || '';
    t = t.replace(/\s+/g, ' ').trim();
    return t.length > 110 ? t.slice(0, 110) + '…' : (t || '(空输入)');
  }

  function renderInputList() {
    navTotal.textContent = String(userNodes.length);
    navList.innerHTML = '';
    if (!userNodes.length) {
      navList.appendChild(el('div', 'nav-empty', '暂无输入'));
      return;
    }
    userNodes.forEach((node, i) => {
      const item = el('button', 'nav-item');
      item.dataset.index = String(i);
      if (node === activeInput) item.classList.add('active');
      item.appendChild(el('span', 'nav-idx', String(i + 1)));
      item.appendChild(el('span', 'nav-text', esc(previewOf(node))));
      item.addEventListener('click', () => gotoInput(i));
      navList.appendChild(item);
    });
  }

  function updateInputHighlight() {
    navList.querySelectorAll('.nav-item').forEach((it) => {
      it.classList.toggle('active', userNodes[Number(it.dataset.index)] === activeInput);
    });
  }

  function gotoInput(i) {
    const node = userNodes[i];
    if (!node) return;
    node.scrollIntoView({ behavior: 'smooth', block: 'start' });
    node.classList.remove('flash');
    void node.offsetWidth;
    node.classList.add('flash');
    setTimeout(() => node.classList.remove('flash'), 1500);
    activeInput = node;
    navPanel.classList.add('hidden');
    navListBtn.classList.remove('on');
    updateInputHighlight();
  }

  // Scroll-spy: keep the reply counter and the input highlight in sync with the viewport.
  function markActive() {
    const limit = main.getBoundingClientRect().top + 96;

    let idx = -1;
    for (let i = 0; i < assistantNodes.length; i++) {
      if (assistantNodes[i].getBoundingClientRect().top <= limit) idx = i;
      else break;
    }
    const next = idx >= 0 ? assistantNodes[idx] : null;
    if (next !== activeNode) { activeNode = next; refreshNav(); }

    let ui = -1;
    for (let i = 0; i < userNodes.length; i++) {
      if (userNodes[i].getBoundingClientRect().top <= limit) ui = i;
      else break;
    }
    activeInput = ui >= 0 ? userNodes[ui] : null;
    if (!navPanel.classList.contains('hidden')) updateInputHighlight();
  }

  let navSpyFrame = null;
  function scheduleMarkActive() {
    if (navSpyFrame) return;
    navSpyFrame = requestAnimationFrame(() => { navSpyFrame = null; markActive(); });
  }

  // Keep the floating control pinned above the composer (never over input / Send).
  function positionNav() {
    const h = footerEl ? footerEl.getBoundingClientRect().height : 80;
    nav.style.bottom = Math.round(h + 12) + 'px';
    const avail = Math.max(180, window.innerHeight - h - 130);
    navPanel.style.maxHeight = Math.min(avail, Math.round(window.innerHeight * 0.6)) + 'px';
  }

  function thinkBlock(key) {
    if (!thinkBlocks.has(key)) {
      const d = makeThinkBlock('');
      d.querySelector('.inner').textContent = '';
      traceBodyOf(currentAssistant).appendChild(d);
      thinkBlocks.set(key, { el: d, raw: '' });
      updateTrace(currentAssistant);
    }
    return thinkBlocks.get(key);
  }

  // rAF-throttled markdown repaint for streaming text.
  const pendingPaint = new WeakMap();
  function paint(b) { b.el.innerHTML = renderMarkdown(b.raw); scroll(); }
  function schedulePaint(b) {
    if (pendingPaint.has(b)) return;
    const id = requestAnimationFrame(() => { pendingPaint.delete(b); paint(b); });
    pendingPaint.set(b, id);
  }
  function flushPaint() {
    for (const b of textBlocks.values()) paint(b);
  }

  function textBlock(key) {
    if (!textBlocks.has(key)) {
      const d = el('div', 'md');
      bodyOf(currentAssistant).appendChild(d);
      textBlocks.set(key, { el: d, raw: '' });
    }
    return textBlocks.get(key);
  }

  function toolCard(id, name, args) {
    if (!toolEls.has(id)) {
      const d = makeToolCard(name, args);
      traceBodyOf(currentAssistant).appendChild(d);
      toolEls.set(id, { el: d, name });
      updateTrace(currentAssistant);
    }
    const rec = toolEls.get(id);
    if (name) { rec.name = name; rec.el.querySelector('.tname').textContent = name; }
    if (args !== undefined && args !== null && args !== '') {
      rec.el.querySelector('.args').textContent = typeof args === 'string' ? args : JSON.stringify(args, null, 2);
      rec.el.querySelector('.preview').textContent = previewArgs(args);
    }
    return rec;
  }

  function toolResult(id, name, text, isError) {
    const rec = id && toolEls.has(id) ? toolEls.get(id) : toolCard(id || ('r' + Math.random()), name);
    if (isError) rec.el.classList.add('error');
    const res = rec.el.querySelector('.res');
    res.innerHTML = '<pre>' + esc(text || '') + '</pre>';
    scroll();
  }

  /* ---------------- event handling ---------------- */

  function handleAssistantMessage(m) {
    // Static render (from snapshot). Consecutive assistant messages merge into
    // the same reply box, so thinking + tool calls + body stay together.
    const box = ensureReply();
    msgSeq++;
    const tb = traceBodyOf(box);
    for (const c of m.content || []) {
      if (c.type === 'text') {
        bodyOf(box).appendChild(el('div', 'md', renderMarkdown(c.text)));
      } else if (c.type === 'thinking') {
        tb.appendChild(makeThinkBlock(c.thinking || ''));
      } else if (c.type === 'toolCall') {
        const d = makeToolCard(c.name, c.arguments);
        tb.appendChild(d);
        toolEls.set(c.id, { el: d, name: c.name });
      }
    }
    updateTrace(box);
  }

  function handleSnapshot(data) {
    wrap.innerHTML = '';
    currentAssistant = null;
    toolEls.clear();
    allAssistant = [];
    assistantNodes = [];
    activeNode = null;
    userNodes = [];
    activeInput = null;
    msgSeq = 0;
    for (const m of data.messages || []) {
      if (!m || !m.role) continue;
      if (m.role === 'user') {
        const text = typeof m.content === 'string' ? m.content
          : (m.content || []).filter(c => c.type === 'text').map(c => c.text).join('\n');
        addUser(text);
      } else if (m.role === 'assistant') {
        handleAssistantMessage(m);
      } else if (m.role === 'toolResult') {
        const text = (m.content || []).filter(c => c.type === 'text').map(c => c.text).join('\n');
        toolResult(m.toolCallId, m.toolName, text, m.isError);
      } else if (m.role === 'bashExecution') {
        toolResult('bash-' + m.timestamp, 'bash: ' + m.command, m.output, m.exitCode !== 0);
      }
    }
    if (data.state && data.state.model) modelEl.textContent = data.state.model.id + ' · ' + data.state.model.provider;
    if (data.state && data.state.sessionId) {
      hintEl.textContent = 'session ' + data.state.sessionId.slice(0, 8) + ' · live via pi RPC';
      document.title = 'pi · ' + data.state.sessionId.slice(0, 8);
    }
    if (data.state && data.state.sessionFile) {
      currentSessionPath = data.state.sessionFile;
      updateSidebarActive();
    }
    currentAssistant = null;
    syncNav();
    scheduleMarkActive();
    if (focusAfterSnapshot) {
      focusAfterSnapshot = false;
      revealLatestAndFocus();
    }
    scroll();
  }

  function onPiEvent(ev) {
    switch (ev.type) {
      case 'snapshot':
        handleSnapshot(ev);
        break;
      case 'agent_start':
        streaming = true; setStatus(); break;
      case 'agent_end':
        streaming = false; setStatus(); syncNav(); break;
      case 'agent_settled':
        streaming = false; currentAssistant = null; setStatus(); syncNav(); break;
      case 'message_start':
        if (ev.message && ev.message.role === 'assistant') { ensureReply(); msgSeq++; }
        break;
      case 'message_end':
        if (ev.message && ev.message.role === 'assistant') { flushPaint(); syncNav(); }
        break;
      case 'message_update': {
        ensureReply();
        const e = ev.assistantMessageEvent || {};
        const key = msgSeq + ':' + e.contentIndex;
        if (e.type === 'thinking_start') { thinkBlock(key); }
        else if (e.type === 'thinking_delta') {
          const b = thinkBlock(key); b.raw += e.delta || '';
          b.el.querySelector('.inner').textContent = b.raw;
        }
        else if (e.type === 'text_start') { textBlock(key); }
        else if (e.type === 'text_delta') {
          const b = textBlock(key); b.raw += e.delta || '';
          schedulePaint(b);
          // A reply becomes navigable as soon as it emits its first body text.
          if (currentAssistant && b.raw.trim() && !assistantNodes.includes(currentAssistant)) syncNav();
        }
        else if (e.type === 'text_end') {
          const b = textBlocks.get(key);
          if (b) { if (typeof e.content === 'string') b.raw = e.content; paint(b); }
        }
        else if (e.type === 'toolcall_start') { toolCard('tc' + key, 'tool', ''); }
        else if (e.type === 'toolcall_end' && e.toolCall) {
          const rec = toolCard('tc' + key, e.toolCall.name, e.toolCall.arguments);
          toolEls.set(e.toolCall.id, rec); // re-key by real id
        }
        scroll();
        break;
      }
      case 'tool_execution_start':
        ensureReply();
        toolCard(ev.toolCallId, ev.toolName || 'tool', ev.args);
        break;
      case 'tool_execution_update': {
        const rec = toolEls.get(ev.toolCallId);
        if (rec) {
          const txt = (ev.partialResult && ev.partialResult.content || []).filter(c => c.type === 'text').map(c => c.text).join('\n');
          rec.el.querySelector('.res').innerHTML = '<pre>' + esc(txt) + '</pre>';
          scroll();
        }
        break;
      }
      case 'tool_execution_end': {
        const txt = (ev.result && ev.result.content || []).filter(c => c.type === 'text').map(c => c.text).join('\n');
        toolResult(ev.toolCallId, ev.toolName, txt, ev.isError);
        break;
      }
      case 'extension_ui_request':
        handleUiRequest(ev);
        break;
      case 'stderr':
        if (ev.text && ev.text.trim()) addSystem(ev.text.trim());
        break;
      case 'pi_exit':
        addSystem('pi process exited (code ' + ev.code + ')');
        dot.className = 'dot';
        statusEl.textContent = 'exited';
        break;
    }
  }

  function setStatus() {
    dot.className = 'dot ' + (streaming ? 'busy' : 'on');
    statusEl.textContent = streaming ? 'working…' : 'idle';
    stopBtn.disabled = !streaming;
  }

  /* ---------------- extension UI dialogs ---------------- */

  function handleUiRequest(ev) {
    const m = ev.method;
    if (m === 'notify') { addSystem((ev.notifyType ? '[' + ev.notifyType + '] ' : '') + ev.message); return; }
    if (m === 'setStatus') { statusEl.textContent = ev.statusText || statusEl.textContent; return; }
    if (m === 'set_editor_text') { input.value = ev.text || ''; return; }
    if (!['select', 'confirm', 'input', 'editor'].includes(m)) return;

    modal.innerHTML = '';
    modal.appendChild(el('h3', null, esc(ev.title || m)));
    if (ev.message) modal.appendChild(el('div', null, esc(ev.message)));

    const respond = (payload) => { backdrop.classList.remove('show'); fetch('/ui-response', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ id: ev.id, ...payload }) }); };
    const cancel = () => respond({ cancelled: true });

    if (m === 'select') {
      const opts = el('div', 'opts');
      (ev.options || []).forEach((o) => opts.appendChild(el('button', null, esc(o))).addEventListener('click', () => respond({ value: o })));
      modal.appendChild(opts);
    } else if (m === 'confirm') {
      const opts = el('div', 'opts');
      const yes = el('button', null, 'Confirm'); yes.addEventListener('click', () => respond({ confirmed: true }));
      const no = el('button', null, 'Cancel'); no.addEventListener('click', cancel);
      opts.appendChild(yes); opts.appendChild(no); modal.appendChild(opts);
    } else {
      const ta = el('textarea'); ta.value = ev.prefill || ''; ta.rows = m === 'editor' ? 8 : 3;
      modal.appendChild(ta);
      const row = el('div', 'row');
      const ok = el('button', null, 'Submit'); ok.addEventListener('click', () => respond({ value: ta.value }));
      const no = el('button', 'ghost', 'Cancel'); no.addEventListener('click', cancel);
      row.appendChild(no); row.appendChild(ok); modal.appendChild(row);
    }
    if (m === 'select' || m === 'confirm') {
      const row = el('div', 'row');
      const no = el('button', 'ghost', 'Cancel'); no.addEventListener('click', cancel);
      row.appendChild(no); modal.appendChild(row);
    }
    backdrop.classList.add('show');
  }

  /* ---------------- session sidebar ---------------- */

  async function loadSessions() {
    sbList.innerHTML = '<div class="sb-empty">加载中…</div>';
    try {
      const r = await fetch('/sessions');
      const data = await r.json();
      sessionList = data.sessions || [];
      if (data.current) currentSessionPath = data.current;
      renderSessions();
    } catch (err) {
      sbList.innerHTML = '<div class="sb-empty">加载失败</div>';
    }
  }

  function shortCwd(cwd) {
    if (!cwd) return '';
    const parts = String(cwd).split('/').filter(Boolean);
    return parts.slice(-2).join('/');
  }

  function relTime(ms) {
    const d = Date.now() - Number(ms || 0);
    if (!isFinite(d) || d < 0) return '';
    const min = Math.floor(d / 60000);
    if (min < 1) return '刚刚';
    if (min < 60) return min + ' 分钟前';
    const h = Math.floor(min / 60);
    if (h < 24) return h + ' 小时前';
    const days = Math.floor(h / 24);
    if (days < 30) return days + ' 天前';
    return new Date(Number(ms)).toLocaleDateString();
  }

  function renderSessions() {
    sbList.innerHTML = '';
    if (!sessionList.length) {
      sbList.appendChild(el('div', 'sb-empty', '暂无会话'));
      return;
    }
    sessionList.forEach((s) => {
      const row = el('div', 'sb-row');
      row.dataset.path = s.path;
      if (currentSessionPath && s.path === currentSessionPath) row.classList.add('active');

      const item = el('button', 'sb-item');
      item.dataset.path = s.path;
      item.appendChild(el('div', 'sb-item-title', esc(s.title || '(空会话)')));
      const meta = el('div', 'sb-item-meta');
      meta.appendChild(el('span', 'proj', esc(shortCwd(s.cwd) || '')));
      meta.appendChild(el('span', null, (s.messages || 0) + ' 条'));
      if (s.forks > 1) meta.appendChild(el('span', 'sb-forks', '＋' + (s.forks - 1) + ' 分支'));
      meta.appendChild(el('span', null, esc(relTime(s.mtime))));
      item.appendChild(meta);
      item.title = s.path;
      item.addEventListener('click', () => switchSession(s.path));
      row.appendChild(item);

      const del = el('button', 'sb-del', '×');
      del.title = '删除会话';
      del.addEventListener('click', (e) => { e.stopPropagation(); deleteSession(s.path, s.title); });
      row.appendChild(del);

      sbList.appendChild(row);
    });
    updateSidebarActive();
  }

  function updateSidebarActive() {
    const items = sbList.querySelectorAll('.sb-row');
    let active = null;
    items.forEach((it) => {
      const on = currentSessionPath && it.dataset.path === currentSessionPath;
      it.classList.toggle('active', !!on);
      if (on) active = it;
    });
    if (active) active.scrollIntoView({ block: 'nearest' });
  }

  /** Scroll to the newest body-text reply, then focus the composer. */
  function revealLatestAndFocus() {
    requestAnimationFrame(() => {
      const total = assistantNodes.length;
      if (total) {
        stickToBottom = false;   // stay on the reply we jumped to
        const node = assistantNodes[total - 1];
        node.scrollIntoView({ block: 'start' });
        activeNode = node;
        refreshNav();
      } else {
        stickToBottom = true;
        main.scrollTop = main.scrollHeight;
      }
      input.focus();
    });
  }

  async function switchSession(p) {
    if (!p) return;
    if (p === currentSessionPath) { input.focus(); return; }
    focusAfterSnapshot = true;
    hintEl.textContent = '正在切换会话…';
    try {
      const r = await fetch('/switch-session', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ path: p }),
      });
      if (!r.ok) throw new Error((await r.json()).error || 'switch failed');
      currentSessionPath = p;
      updateSidebarActive();
      setTimeout(loadSessions, 800);
    } catch (err) {
      focusAfterSnapshot = false;
      addSystem('切换会话失败: ' + err.message);
      loadSessions();
    }
  }

  async function newSession() {
    focusAfterSnapshot = true;
    try {
      const r = await fetch('/new-session', { method: 'POST' });
      if (!r.ok) throw new Error('new session failed');
      setTimeout(loadSessions, 700);
    } catch (err) {
      focusAfterSnapshot = false;
      addSystem('新建会话失败: ' + err.message);
    }
  }

  async function deleteSession(p, title) {
    if (!confirm('删除这个会话？\n\n' + (title || p) + '\n\n' + p)) return;
    try {
      const r = await fetch('/delete-session', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ path: p }),
      });
      if (!r.ok) throw new Error((await r.json()).error || 'delete failed');
      await loadSessions();
    } catch (err) {
      addSystem('删除失败: ' + err.message);
    }
  }

  function toggleSidebar(collapsed) {
    sidebar.classList.toggle('collapsed', collapsed);
    try { localStorage.setItem('pi-webui:sidebar', collapsed ? '0' : '1'); } catch { /* ignore */ }
  }

  /* ---------------- transport ---------------- */

  function connect() {
    const es = new EventSource('/events');
    es.onopen = () => { setStatus(); hintEl.textContent = 'live · streamed from the pi RPC session'; };
    es.onmessage = (e) => { try { onPiEvent(JSON.parse(e.data)); } catch (err) { console.error(err, e.data); } };
    es.onerror = () => {
      dot.className = 'dot';
      statusEl.textContent = 'reconnecting…';
      es.close();
      setTimeout(connect, 1500);
    };
  }

  async function send() {
    const message = input.value.trim();
    if (!message) return;
    input.value = '';
    // Sending a new instruction re-enables follow mode and jumps to the newest output.
    stickToBottom = true;
    addUser(message);
    main.scrollTop = main.scrollHeight;
    positionNav();
    await fetch('/prompt', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ message, behavior: 'steer' }) });
  }

  sendBtn.addEventListener('click', send);
  stopBtn.addEventListener('click', () => fetch('/abort', { method: 'POST' }));
  input.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); }
  });
  input.addEventListener('input', () => {
    input.style.height = 'auto';
    input.style.height = Math.min(input.scrollHeight, 200) + 'px';
    positionNav();
  });

  navPrev.addEventListener('click', () => stepAssistant(-1));
  navNext.addEventListener('click', () => stepAssistant(1));
  sbToggle.addEventListener('click', () => toggleSidebar(!sidebar.classList.contains('collapsed')));
  sbRefresh.addEventListener('click', () => loadSessions());
  sbNew.addEventListener('click', () => newSession());
  navListBtn.addEventListener('click', () => {
    const open = navPanel.classList.toggle('hidden') === false;
    navListBtn.classList.toggle('on', open);
    if (open) { renderInputList(); updateInputHighlight(); positionNav(); }
  });
  navPanelClose.addEventListener('click', () => {
    navPanel.classList.add('hidden');
    navListBtn.classList.remove('on');
  });
  window.addEventListener('resize', positionNav);
  main.addEventListener('scroll', () => {
    // user (or a jump) moved the viewport: follow only while pinned to the bottom
    stickToBottom = atBottom();
    scheduleMarkActive();
  }, { passive: true });
  document.addEventListener('keydown', (e) => {
    if (!e.altKey) return;
    if (e.key === 'ArrowUp') { e.preventDefault(); stepAssistant(-1); }
    else if (e.key === 'ArrowDown') { e.preventDefault(); stepAssistant(1); }
  });

  // restore sidebar preference (auto-collapse on narrow screens)
  try {
    const savedSidebar = localStorage.getItem('pi-webui:sidebar');
    if (savedSidebar === '0' || (savedSidebar === null && window.innerWidth < 860)) {
      sidebar.classList.add('collapsed');
    }
  } catch { /* ignore */ }

  setStatus();
  positionNav();
  refreshNav();
  loadSessions();
  connect();
})();
</script>
</body>
</html>
